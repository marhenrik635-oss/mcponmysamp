[project]
name = "mcp-gta-samp"
version = "0.1.0"
description = "AI-native integration testing foundation for SA-MP/open.mp"
requires-python = ">=3.10"
dependencies = ["mcp>=1.28,<2"]

[project.urls]
Repository = "https://github.com/marhenrik635-oss/mcponmysamp"
License = "https://opensource.org/license/mit"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.license]
file = "LICENSE"

[project.scripts]
mcp-gta-samp = "mcp_gta_samp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_gta_samp"]
